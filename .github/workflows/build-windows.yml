name: Build (Windows/Linux)

on:
  pull_request:
  workflow_dispatch:


env:
  REGISTRY: ghcr.io/euro-office
  CACHE_IMAGE_NAME: desktopeditors-build-cache
  PRODUCT_VERSION: 9.3.1
  BUILD_NUMBER: dev.1
  BUILD_ROOT: /package

jobs:

  # ─────────────────────────────────────────────────────────────
  # BUILD
  #
  # Single job that builds the full target graph in one bake
  # invocation per arch × brand. Because develop depends on
  # docker which depends on packages, bake resolves the shared
  # graph and never rebuilds a layer twice.
  #
  # Pushing per target:
  #   docker   → pushed on default branch (:nightly) and git tags (:latest)
  #   develop  → pushed on default branch only (:latest-dev)
  #   packages → never pushed; exported to local filesystem for release upload
  #              (euro-office → GitHub Release, nextcloud-office → SSH)
  # ─────────────────────────────────────────────────────────────
  build-common:
    runs-on: 'ubuntu-latest'
    permissions:
      contents: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        brand:
          - name: euro-office
            image_name: desktop-common
            extra_bake_files: ""
            extra_targets: ""
            cache_prefix: ""
          #- name: nextcloud-office
          #  image_name: no-desktop-common
          #  extra_bake_files: "./brands/nextcloud-office-brand/brand-server.hcl"
          #  extra_targets: "brand-icons,"
          #  cache_prefix: "nextcloud-office-"

    steps:
      - name: Checkout fork repository (with submodules)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: .
          submodules: recursive
          token: ${{ secrets.EURO_OFFICE_MIRROR_TOKEN }}

      - name: Checkout nextcloud-office-brand repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: Euro-Office/nextcloud-office-brand
          path: build/brands/nextcloud-office-brand
          token: ${{ secrets.EURO_OFFICE_MIRROR_TOKEN }}

      - name: Debug workspace
        run: |
          echo "workspace: ${{ github.workspace }}"
          ls -la "${{ github.workspace }}"
          ls -la "${{ github.workspace }}/build" || echo "build/ MISSING"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags and push flags
        id: meta
        run: |
          REF_NAME=$(echo '${{ github.ref_name }}' | tr '/' '-')
          echo "ref_name=${REF_NAME}" >> $GITHUB_OUTPUT

          echo "sha_short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

          # Parse PRODUCT_VERSION / BUILD_NUMBER from tag of the form v${PRODUCT_VERSION}-${BUILD_NUMBER}
          # (e.g. v9.3.1-beta.1, v9.3.1-stable.1). Fall back to env defaults otherwise.
          if [[ "$IS_TAG" == "true" && "${{ github.ref_name }}" =~ ^v([^-]+)-(.+)$ ]]; then
            echo "product_version=${BASH_REMATCH[1]}" >> $GITHUB_OUTPUT
            echo "build_number=${BASH_REMATCH[2]}"    >> $GITHUB_OUTPUT
          else
            echo "product_version=${{ env.PRODUCT_VERSION }}" >> $GITHUB_OUTPUT
            echo "build_number=${{ env.BUILD_NUMBER }}"       >> $GITHUB_OUTPUT
          fi

      - name: Build all targets (packages → docker → develop)
        uses: docker/bake-action@4a9a8d494466d37134e2bfca2d3a8de8fb2681ad # v5.13.0
        with:
          workdir: ./build
          # For nextcloud-office, brand-server.hcl is appended; empty lines are
          # filtered by bake-action so euro-office sees only the base file.
          files: |
            ./docker-bake.hcl
          # extra_targets is either "" (euro-office) or "brand-icons," so the
          # comma-joined target list resolves correctly for both.
          targets: desktop-common
          # push=false here; per-target pushing is controlled via tags below.
          # Targets with empty tags= are not pushed regardless of this flag.
          push: false
          set: |
            core-base.cache-from=type=registry,ref=${{ env.REGISTRY }}/${{ env.CACHE_IMAGE_NAME }}:${{ steps.meta.outputs.ref_name }}-${{ matrix.brand.cache_prefix }}core-base-buildcache
            core-base.cache-to=type=registry,ref=${{ env.REGISTRY }}/${{ env.CACHE_IMAGE_NAME }}:${{ steps.meta.outputs.ref_name }}-${{ matrix.brand.cache_prefix }}core-base-buildcache,mode=max
            core-base.tags=
            core-wasm.cache-from=type=registry,ref=${{ env.REGISTRY }}/${{ env.CACHE_IMAGE_NAME }}:${{ steps.meta.outputs.ref_name }}-${{ matrix.brand.cache_prefix }}core-wasm-buildcache
            core-wasm.cache-to=type=registry,ref=${{ env.REGISTRY }}/${{ env.CACHE_IMAGE_NAME }}:${{ steps.meta.outputs.ref_name }}-${{ matrix.brand.cache_prefix }}core-wasm-buildcache,mode=max
            core-wasm.tags=
            sdkjs-desktop.cache-from=type=registry,ref=${{ env.REGISTRY }}/${{ env.CACHE_IMAGE_NAME }}:${{ steps.meta.outputs.ref_name }}-${{ matrix.brand.cache_prefix }}sdkjs-desktop-buildcache
            sdkjs-desktop.cache-to=type=registry,ref=${{ env.REGISTRY }}/${{ env.CACHE_IMAGE_NAME }}:${{ steps.meta.outputs.ref_name }}-${{ matrix.brand.cache_prefix }}sdkjs-desktop-buildcache,mode=max
            sdkjs-desktop.tags=
            desktop-js.cache-from=type=registry,ref=${{ env.REGISTRY }}/${{ env.CACHE_IMAGE_NAME }}:${{ steps.meta.outputs.ref_name }}-${{ matrix.brand.cache_prefix }}desktop-js-buildcache
            desktop-js.cache-to=type=registry,ref=${{ env.REGISTRY }}/${{ env.CACHE_IMAGE_NAME }}:${{ steps.meta.outputs.ref_name }}-${{ matrix.brand.cache_prefix }}desktop-js-buildcache,mode=max
            desktop-js.tags=
            web-apps.cache-from=type=registry,ref=${{ env.REGISTRY }}/${{ env.CACHE_IMAGE_NAME }}:${{ steps.meta.outputs.ref_name }}-${{ matrix.brand.cache_prefix }}web-apps-buildcache
            web-apps.cache-to=type=registry,ref=${{ env.REGISTRY }}/${{ env.CACHE_IMAGE_NAME }}:${{ steps.meta.outputs.ref_name }}-${{ matrix.brand.cache_prefix }}web-apps-buildcache,mode=max
            web-apps.tags=
            allgen-builder.cache-from=type=registry,ref=${{ env.REGISTRY }}/${{ env.CACHE_IMAGE_NAME }}:${{ steps.meta.outputs.ref_name }}-${{ matrix.brand.cache_prefix }}allgen-builder-buildcache
            allgen-builder.cache-to=type=registry,ref=${{ env.REGISTRY }}/${{ env.CACHE_IMAGE_NAME }}:${{ steps.meta.outputs.ref_name }}-${{ matrix.brand.cache_prefix }}allgen-builder-buildcache,mode=max
            allgen-builder.tags=
            desktop-common.cache-from=type=registry,ref=${{ env.REGISTRY }}/${{ env.CACHE_IMAGE_NAME }}:${{ steps.meta.outputs.ref_name }}-${{ matrix.brand.cache_prefix }}desktop-common-buildcache
            desktop-common.cache-to=type=registry,ref=${{ env.REGISTRY }}/${{ env.CACHE_IMAGE_NAME }}:${{ steps.meta.outputs.ref_name }}-${{ matrix.brand.cache_prefix }}desktop-common-buildcache,mode=max
            desktop-common.tags=${{format('{0}/{1}:{2}', env.REGISTRY, matrix.brand.image_name, steps.meta.outputs.sha_short)}}
            desktop-common.output='type=registry'
        env:
          REGISTRY: ${{ env.REGISTRY }}
          PRODUCT_VERSION: ${{ steps.meta.outputs.product_version }}
          BUILD_NUMBER: ${{ steps.meta.outputs.build_number }}
          BUILD_ROOT: ${{ env.BUILD_ROOT }}
          NUGET_CACHE: local

      - name: Extract files from image
        run: |
          docker create --name tmp ${{ env.REGISTRY }}/${{ matrix.brand.image_name }}:${{ steps.meta.outputs.sha_short }}
          docker cp tmp:/ ./common
          docker rm tmp
      - uses: actions/upload-artifact@v4
        with:
          name: common-files
          path: |
            common

  build-windows:
    runs-on: windows-2022
    needs: build-common

    env:
      PYTHONUTF8: "1"
      NEXTCLOUD_USER: ${{ secrets.NEXTCLOUD_USER }}
      NEXTCLOUD_PASS: ${{ secrets.NEXTCLOUD_PASS }}

    steps:
      # ------------------------------------------------------------------ #
      # 1. Checkout
      # ------------------------------------------------------------------ #
      - name: Checkout fork repository (with submodules)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: .
          submodules: recursive
          token: ${{ secrets.EURO_OFFICE_MIRROR_TOKEN }}

      - name: Checkout nextcloud-office-brand repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: Euro-Office/nextcloud-office-brand
          path: build/brands/nextcloud-office-brand
          token: ${{ secrets.EURO_OFFICE_MIRROR_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          name: common-files
          path: .\common

      - name: Copy files into place
        shell: pwsh
        run: |
          $dest = 'desktop-apps\common\loginpage\deploy'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item .\common\index.html -Destination $dest\index.html
          Copy-Item .\common\editors\webext\noconnect.html -Destination $dest\noconnect.html

      # ------------------------------------------------------------------ #
      # 2. Install Cygwin WITHOUT touching PATH.
      #
      #    By default cygwin-install-action PREPENDS C:\cygwin\bin to PATH,
      #    which makes Cygwin's perl/python/git/cmake shadow the Windows-
      #    native tools no matter what we do afterwards. add-to-path: false
      #    stops that at the source — no shim renaming needed.
      # ------------------------------------------------------------------ #
      - name: Install Cygwin
        uses: cygwin/cygwin-install-action@v4
        with:
          # Pin the install location explicitly. The action's default has
          # changed between versions (C:\cygwin, later D:\cygwin), while
          # most build scripts that shell out to Cygwin assume the stock
          # installer location C:\cygwin64. A hardcoded path that doesn't
          # exist is exactly what produces Windows error 3:
          # "The system cannot find the path specified."
          install-dir: 'C:\cygwin64'
          add-to-path: false
          packages: >-
            automake
            cmake
            make
            git
            python3
            python3-devel

      # ------------------------------------------------------------------ #
      # 3. Build a deterministic PATH:
      #      [native perl/python/git/cmake dirs] ; [Cygwin] ; [everything else]
      #
      #    Why not just append Cygwin at the end? Because the runner image
      #    already has Git's MSYS tools (C:\Program Files\Git\usr\bin) in
      #    PATH — with Cygwin last, a bare `bash`/`sh` resolves to Git's
      #    MSYS bash, which is NOT a valid substitute for a Cygwin/MSVC
      #    build of ICU. This ordering gives Cygwin's bash/make/sh priority
      #    while the four conflicting tools stay Windows-native.
      #
      #    CYGWIN_ROOT is exported for build scripts that locate Cygwin
      #    via an environment variable instead of PATH.
      # ------------------------------------------------------------------ #
      - name: Set up PATH ordering (native tools > Cygwin > rest)
        shell: pwsh
        run: |
          $cyg = 'C:\cygwin64'
          $nativeDirs = @()
          foreach ($tool in 'perl', 'python', 'git', 'cmake') {
            $cmd = Get-Command $tool -ErrorAction SilentlyContinue
            if ($cmd -and ($cmd.Source -notlike "$cyg\*")) {
              $dir = Split-Path $cmd.Source
              # Git for Windows trap: 'Git\bin' contains git.exe but ALSO
              # bash.exe and sh.exe, which would shadow Cygwin's. The
              # sibling 'Git\cmd' directory contains only the git launcher,
              # so prefer that one.
              if ($tool -eq 'git' -and $dir -like '*\Git\bin') {
                $cmdDir = Join-Path (Split-Path $dir) 'cmd'
                if (Test-Path (Join-Path $cmdDir 'git.exe')) { $dir = $cmdDir }
              }
              if ($nativeDirs -notcontains $dir) { $nativeDirs += $dir }
              Write-Host ("native {0,-8} -> {1}  (PATH dir: {2})" -f $tool, $cmd.Source, $dir)
            }
          }
          $newPath = ($nativeDirs + "$cyg\bin" + $env:PATH) -join ';'
          "PATH=$newPath"      | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CYGWIN_ROOT=$cyg"   | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append


      # ------------------------------------------------------------------ #
      # 4. Install Windows SDK + MSVC v141 toolset + ATL (x86 & x64)
      # ------------------------------------------------------------------ #
      - name: Install Windows SDK, v141 toolset and ATL
        shell: pwsh
        run: |
          $vsWhere     = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsInstaller = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"
          $installPath = & $vsWhere -latest -products * -property installationPath
          Write-Host "VS install path: $installPath"
          & $vsInstaller modify `
            --installPath $installPath `
            --add Microsoft.VisualStudio.Component.Windows10SDK.19041 `
            --add Microsoft.VisualStudio.Component.VC.v141.x86.x64 `
            --add Microsoft.VisualStudio.Component.VC.v141.ATL `
            --add Microsoft.VisualStudio.Component.VC.v141.MFC `
            --quiet --norestart --force
          if ($LASTEXITCODE -notin @(0, 3010)) {
            Write-Warning "vs_installer returned $LASTEXITCODE — components may already be installed, continuing."
          }

      # ------------------------------------------------------------------ #
      # 5. Verify tool resolution — Get-Command shows exactly which binary
      #    each bare name resolves to, so failures are self-explanatory.
      # ------------------------------------------------------------------ #
      - name: Verify tool versions
        shell: pwsh
        run: |
          foreach ($tool in 'perl', 'python', 'git', 'cmake') {
            $cmd = Get-Command $tool -ErrorAction SilentlyContinue
            if ($cmd) {
              Write-Host ("{0,-8} -> {1}" -f $tool, $cmd.Source)
              if ($cmd.Source -like 'C:\cygwin64\*') {
                throw "ERROR: '$tool' resolves to the Cygwin copy at $($cmd.Source)."
              }
            } else {
              Write-Host ("{0,-8} -> (not found in PATH)" -f $tool)
            }
          }

          # These SHOULD be the Cygwin copies (ICU's Cygwin/MSVC build needs them)
          foreach ($tool in 'bash', 'sh', 'make') {
            $cmd = Get-Command $tool -ErrorAction SilentlyContinue
            if ($cmd) {
              Write-Host ("{0,-8} -> {1}" -f $tool, $cmd.Source)
              if ($cmd.Source -notlike 'C:\cygwin64\*') {
                throw "ERROR: '$tool' resolves to a non-Cygwin copy at $($cmd.Source)."
              }
            } else {
              throw "ERROR: '$tool' not found in PATH."
            }
          }

          Write-Host "--- perl ---"
          perl --version | Select-String 'This is perl'
          $perlOut = (perl --version) -join ''
          if ($perlOut -match 'cygwin') {
            throw "ERROR: 'perl' is Cygwin Perl."
          }

          Write-Host "--- python ---"
          python --version
          py --version

          Write-Host "--- git ---"
          git --version

          Write-Host "--- cmake ---"
          cmake --version

          # NB: don't try to run C:\cygwin64\bin\python3 directly from pwsh —
          # it's a Cygwin-style symlink that cmd/pwsh can't execute. If you
          # ever need Cygwin python, call it via:
          #   C:\cygwin64\bin\bash.exe -lc 'python3 --version'

      # ------------------------------------------------------------------ #
      # 6. Set up vcpkg  (matches the Linux workflow)
      # ------------------------------------------------------------------ #
      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11

      # ------------------------------------------------------------------ #
      # 7. CMake Configure
      #    vcvars64.bat is located via vswhere so the VS edition (Enterprise/
      #    Professional/Community) and future image changes don't matter.
      # ------------------------------------------------------------------ #
      - name: CMake Configure
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSPATH=%%i"
          echo Using VS at: %VSPATH%
          call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat" 10.0.19041.0
          if errorlevel 1 exit /b 1

          set PYTHONUTF8=1

          cmake -G "Visual Studio 17 2022" ^
            -DCMAKE_TOOLCHAIN_FILE="%VCPKG_ROOT%\scripts\buildsystems\vcpkg.cmake" ^
            -DVCPKG_MANIFEST_MODE=ON ^
            -DVCPKG_MANIFEST_DIR="core" ^
            -DABOUT_PAGE_APP_NAME="Desktop Editors" ^
            desktop-apps/win-linux/

      # ------------------------------------------------------------------ #
      # 8. CMake Build
      # ------------------------------------------------------------------ #
      - name: CMake Build
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSPATH=%%i"
          call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat" 10.0.19041.0
          if errorlevel 1 exit /b 1

          set PYTHONUTF8=1

          cmake --build . --config Release --parallel ^
            -- /p:UseMultiToolTask=true /p:EnforceProcessCountAcrossBuilds=true


      # ------------------------------------------------------------------ #
      # 9. Upload build artifacts
      # ------------------------------------------------------------------ #
      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: build-output-windows
          path: |
            package/bin/
            package/tools/
          if-no-files-found: warn