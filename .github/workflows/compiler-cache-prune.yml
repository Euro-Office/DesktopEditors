# Every run saves its compiler caches under new keys, and only the newest one
# per build leg is ever restored. Deletes the others of this ref, or the
# repository's Actions caches outgrow their limit and GitHub evicts the ones
# still in use.
name: Prune compiler caches

on:
  workflow_call:

jobs:
  prune:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
    - name: Prune
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        for prefix in Linux-desktop- Linux-wasm- macOS-macos-ccache- sccache-windows- ccache-windows-; do
          gh cache list --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF" --key "$prefix" \
              --sort created_at --order desc --limit 1000 --json id,key |
            jq -r 'group_by(.key | sub("-[0-9]+$"; "")) | map(.[1:]) | flatten | .[].id' |
            while read -r id; do
              gh cache delete "$id" --repo "$GITHUB_REPOSITORY" || true
            done
        done
