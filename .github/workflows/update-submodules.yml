name: Update submodules to latest main branch

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

jobs:
  update-submodules:
    # Private copies sync from the public repository instead
    if: github.repository == 'Euro-Office/DesktopEditors'
    permissions:
      contents: write
      pull-requests: write
    uses: Euro-Office/DocumentServer/.github/workflows/update-submodules.yml@main
    secrets: inherit
